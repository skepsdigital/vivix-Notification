AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'schedule-notification

  Sample SAM Template for serverless app

  '
Globals:
  Function:
    Tags:
      APP: HELLO WORLD APP
      TYPE: TEMPLATE APP
    Timeout: 300
    Runtime: nodejs16.x
    Architectures:
    - x86_64
Resources:
  NotificationVivixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: NotificationVivixFunction
      Handler: trigger/index.handler
      Environment:
        Variables:
          BLIP_TOKEN: Key dml2aXhyb3V0ZXI6N29sTk5PdkJKR1NzWFIxbDZkNmM=
          FLOW_ID: 808bdb24-d9c4-4947-88f0-f91c3b7e9da2
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /NotificationVivix
            Method: post
    Metadata:
      SamResourceId: NotificationVivixFunction
Outputs:
  NotificationVivixApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/NotificationVivix/
  NotificationVivixFunction:
    Description: NotificationVivixFunction Lambda Function ARN
    Value:
      Fn::GetAtt:
      - NotificationVivixFunction
      - Arn
  NotificationVivixFunctionIamRole:
    Description: Implicit IAM Role created for NotificationVivixFunction
    Value:
      Fn::GetAtt:
      - NotificationVivixFunctionRole
      - Arn
