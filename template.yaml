AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  vivix-notification

  Sample SAM Template for serverless app

Parameters:
  BasicAuthUser:
    Type: String
    NoEcho: true
    Description: Usuário do Basic Auth da rota /NotificationVivix
  BasicAuthPassword:
    Type: String
    NoEcho: true
    Description: Senha do Basic Auth da rota /NotificationVivix

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Tags:
      APP: 'HELLO WORLD APP'
      TYPE: 'TEMPLATE APP'
    Timeout: 300
    Runtime: nodejs16.x
    Architectures:
      - x86_64

Resources:
  ##########################################################################
  #   Lambda                                                               #
  ##########################################################################
  NotificationVivixFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: dist/
      Handler: trigger/index.handler
      Environment:
        Variables:
          BLIP_TOKEN: "Key dml2aXhyb3V0ZXI6N29sTk5PdkJKR1NzWFIxbDZkNmM="
          FLOW_ID: "808bdb24-d9c4-4947-88f0-f91c3b7e9da2"
          BASIC_AUTH_USER: !Ref BasicAuthUser
          BASIC_AUTH_PASSWORD: !Ref BasicAuthPassword
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /NotificationVivix
            Method: post

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  NotificationVivixApi:
    Description: 'API Gateway endpoint URL for Prod stage for Hello World function'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/NotificationVivix/'
  NotificationVivixFunction:
    Description: 'NotificationVivixFunction Lambda Function ARN'
    Value: !GetAtt NotificationVivixFunction.Arn
  NotificationVivixFunctionIamRole:
    Description: 'Implicit IAM Role created for NotificationVivixFunction'
    Value: !GetAtt NotificationVivixFunctionRole.Arn
